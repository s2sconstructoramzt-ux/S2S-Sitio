<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S2S — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --charcoal:#22262B; --concrete:#EDEAE2; --line:#D9D3C4;
    --blueprint:#35566B; --clay:#A6572E; --graphite:#565F68; --white:#FFFFFF;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:inherit; margin:0; padding:0; }
  body { background:var(--concrete); color:var(--charcoal); font-family:'Inter',system-ui,sans-serif; line-height:1.5; }
  h1,h2 { font-family:'Zilla Slab',Georgia,serif; }
  header { background:var(--charcoal); color:#fff; padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px; border-bottom:3px solid var(--clay); }
  header h1 { font-size:1.5rem; }
  header .sub { font-size:.78rem; color:#A9AFB6; margin-top:2px; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .panel { background:var(--white); border:1px solid var(--line); padding:18px; margin-bottom:22px; }
  .panel h2 { font-size:1.2rem; margin-bottom:14px; }
  .row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .field { flex:1; min-width:130px; display:flex; flex-direction:column; gap:4px; }
  .grow { flex:3; min-width:160px; }
  label { font-size:.78rem; color:var(--graphite); }
  select,input,textarea { font-family:'Inter',sans-serif; font-size:16px; padding:9px 10px; border:1px solid var(--line); background:var(--concrete); color:var(--charcoal); width:100%; }
  textarea { resize:vertical; }
  ::placeholder { color:#B0AC9F; font-style:italic; opacity:1; }
  .toggle { display:flex; gap:8px; margin-bottom:14px; }
  .toggle button { flex:1; padding:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font-family:'Inter',sans-serif; font-size:.9rem; color:var(--graphite); }
  .toggle button.active.recibido { background:var(--blueprint); color:#fff; border-color:var(--blueprint); }
  .toggle button.active.entregado { background:var(--clay); color:#fff; border-color:var(--clay); }
  .sec-title { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--graphite); margin:16px 0 8px; }
  .add-btn { width:100%; padding:11px; border:1px dashed var(--blueprint); background:transparent; color:var(--blueprint); cursor:pointer; font-family:'Inter',sans-serif; font-size:.92rem; margin-bottom:12px; }
  .item-card { border:1px solid var(--line); background:#FAF8F3; padding:12px; margin-bottom:12px; }
  .item-head { display:flex; justify-content:space-between; align-items:center; font-size:.8rem; color:var(--graphite); margin-bottom:8px; }
  .link { background:none; border:none; color:var(--clay); font-size:.8rem; cursor:pointer; font-family:'Inter',sans-serif; }
  .qty-field { flex:0 0 138px; min-width:138px; }
  .qty { display:flex; }
  .qty button { width:38px; border:1px solid var(--line); background:#fff; font-size:1.2rem; cursor:pointer; color:var(--charcoal); }
  .qty input { text-align:center; min-width:0; }
  .who { border:1px solid var(--line); padding:12px; margin-bottom:12px; }
  .who h3 { font-size:.85rem; margin-bottom:8px; color:var(--blueprint); font-family:'Inter',sans-serif; font-weight:600; }
  .submit { width:100%; padding:13px; background:var(--charcoal); color:#fff; border:none; font-family:'Inter',sans-serif; font-size:1rem; cursor:pointer; margin-top:6px; }
  .submit:disabled { opacity:.5; }
  .msg { font-size:.85rem; margin-top:10px; }
  .msg.ok { color:var(--blueprint); } .msg.err { color:var(--clay); }
  .mov { border:1px solid var(--line); padding:12px; margin-bottom:12px; }
  .mov-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; font-size:.78rem; color:var(--graphite); }
  .tag { font-size:.7rem; padding:2px 8px; border:1px solid currentColor; }
  .tag.recibido { color:var(--blueprint); } .tag.entregado { color:var(--clay); }
  .mov ul { list-style:none; margin-bottom:8px; }
  .mov li { font-size:.9rem; padding:4px 0; border-bottom:1px solid var(--line); }
  .mov li:last-child { border-bottom:none; }
  .obs-txt { display:block; font-size:.8rem; color:var(--clay); }
  .mov-who { font-size:.82rem; color:var(--graphite); }
  .firma { font-family:monospace; font-size:.72rem; color:var(--graphite); margin-top:6px; word-break:break-all; }
  .empty { color:var(--graphite); font-size:.9rem; }
  .back { display:inline-block; color:#A9AFB6; font-size:.85rem; text-decoration:none; margin-bottom:6px; }
  .acciones { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn-mini { padding:8px 12px; border:1px solid var(--blueprint); background:#fff; color:var(--blueprint); font-family:'Inter',sans-serif; font-size:.82rem; cursor:pointer; }
  .btn-mini.prim { background:var(--blueprint); color:#fff; }
  .modal { position:fixed; inset:0; background:rgba(34,38,43,.65); display:none; justify-content:center; align-items:flex-start; padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px; overflow:auto; z-index:20; }
  .modal.open { display:flex; }
  .doc { background:#fff; width:100%; max-width:560px; border:1px solid var(--line); padding:20px; }
  .doc h2 { font-size:1.25rem; margin-bottom:12px; }
  .doc-line { font-size:.9rem; margin-bottom:6px; word-break:break-word; }
  .doc-items { list-style:none; margin:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px 0; }
  .doc-items li { font-size:.9rem; padding:5px 0; border-bottom:1px solid var(--line); }
  .doc-items li:last-child { border-bottom:none; }
  .ok-banner { background:#E4EEF3; color:var(--blueprint); border:1px solid var(--blueprint); padding:10px 12px; font-size:.9rem; margin-bottom:14px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Inicio</a>
  <h1>Inventario — Material y Herramienta</h1>
  <div class="sub">S2S Constructora · registro con firma electrónica</div>
</header>

<main>
  <div class="panel">
    <h2>Nuevo movimiento</h2>
    <div class="toggle">
      <button type="button" id="btnRecibido" class="active recibido">Recibido</button>
      <button type="button" id="btnEntregado" class="entregado">Entregado</button>
    </div>

    <div class="row"><div class="field"><label for="obra">Obra</label><input id="obra" placeholder="Ej. Residencia Los Ángeles"></div></div>

    <div class="sec-title">Material, herramienta o equipo</div>
    <button type="button" class="add-btn" id="btnAdd">+ Añadir otro material o herramienta</button>
    <div id="items"></div>

    <div class="sec-title">Personas</div>
    <div class="who">
      <h3>Quien entrega</h3>
      <div class="row">
        <div class="field"><label>Nombre</label><input id="entNombre" list="nombres" placeholder="Nombre completo" autocomplete="off"></div>
        <div class="field"><label>Cargo</label><input id="entCargo" list="cargos" placeholder="Ej. Almacenista" autocomplete="off"></div>
      </div>
    </div>
    <div class="who">
      <h3>Quien recibe</h3>
      <div class="row">
        <div class="field"><label>Nombre</label><input id="recNombre" list="nombres" placeholder="Nombre completo" autocomplete="off"></div>
        <div class="field"><label>Cargo</label><input id="recCargo" list="cargos" placeholder="Ej. Electricista" autocomplete="off"></div>
      </div>
    </div>
    <datalist id="nombres"></datalist>
    <datalist id="cargos"></datalist>

    <button class="submit" id="btnGuardar">Registrar y firmar</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="panel">
    <h2>Historial</h2>
    <div id="historial"><div class="empty">Cargando…</div></div>
  </div>
</main>

<div class="modal" id="modal"><div class="doc" id="docBox"></div></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCRNsoyLnnWXmfj2ctW0usEeJOYc8etQa0",
    authDomain: "s2s-constructora.firebaseapp.com",
    projectId: "s2s-constructora",
    storageBucket: "s2s-constructora.firebasestorage.app",
    messagingSenderId: "148953456907",
    appId: "1:148953456907:web:1d2908116c0800f57ac20e"
  };

  let tipoActual = "recibido", db = null, personas = {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function itemHTML() {
    return `<div class="item-card">
      <div class="item-head"><span class="item-num"></span><button type="button" class="link quitar">✕ Quitar</button></div>
      <div class="row">
        <div class="field qty-field"><label>Cantidad</label>
          <div class="qty"><button type="button" class="menos">−</button><input class="cant" inputmode="decimal" value="" placeholder="0" autocomplete="off"><button type="button" class="mas">+</button></div>
        </div>
        <div class="field grow"><label>Material o equipo</label><input class="mat" placeholder="Ej. Rotomartillo" autocomplete="off"></div>
      </div>
      <div class="row"><div class="field"><label>Marca</label><input class="marca" placeholder="Ej. Hermex" autocomplete="off"></div></div>
      <div class="row"><div class="field"><label>Observaciones (daños, faltantes, incidentes)</label><textarea class="obs" rows="2" placeholder="Ej. Estuche golpeado, sin broca" autocomplete="off"></textarea></div></div>
    </div>`;
  }

  function renumerar() {
    const cards = document.querySelectorAll("#items .item-card");
    cards.forEach((c, i) => {
      c.querySelector(".item-num").textContent = "Ítem " + (i + 1);
      c.querySelector(".quitar").style.display = cards.length > 1 ? "inline" : "none";
    });
  }

  function reiniciarItems() { $("items").innerHTML = itemHTML(); renumerar(); }

  const items = $("items");
  items.addEventListener("focusin", e => {
    if (e.target.classList.contains("cant")) setTimeout(() => e.target.select(), 0);
  });
  items.addEventListener("click", e => {
    const t = e.target, card = t.closest(".item-card");
    if (t.classList.contains("cant")) { t.select(); return; }
    if (t.classList.contains("mas") || t.classList.contains("menos")) {
      const inp = card.querySelector(".cant");
      const v = parseFloat(inp.value.replace(",", ".")) || 0;
      inp.value = Math.max(0, v + (t.classList.contains("mas") ? 1 : -1));
    }
    if (t.classList.contains("quitar")) { card.remove(); renumerar(); }
  });

  $("btnAdd").addEventListener("click", () => {
    items.insertAdjacentHTML("beforeend", itemHTML());
    renumerar();
    items.lastElementChild.querySelector(".cant").focus();
  });

  $("btnRecibido").addEventListener("click", () => { tipoActual = "recibido"; $("btnRecibido").classList.add("active"); $("btnEntregado").classList.remove("active"); });
  $("btnEntregado").addEventListener("click", () => { tipoActual = "entregado"; $("btnEntregado").classList.add("active"); $("btnRecibido").classList.remove("active"); });

  [["entNombre","entCargo"],["recNombre","recCargo"]].forEach(([n, c]) => {
    $(n).addEventListener("change", () => {
      const cargo = personas[$(n).value.trim()];
      if (cargo && !$(c).value.trim()) $(c).value = cargo;
    });
  });

  function leerItems() {
    return [...document.querySelectorAll("#items .item-card")].map(c => ({
      cantidad: parseFloat(c.querySelector(".cant").value.replace(",", ".")),
      item: c.querySelector(".mat").value.trim(),
      marca: c.querySelector(".marca").value.trim(),
      observaciones: c.querySelector(".obs").value.trim()
    })).filter(i => i.item || i.marca || i.observaciones);
  }

  async function generarFirma(datos) {
    try {
      const buf = new TextEncoder().encode(JSON.stringify(datos));
      const h = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
    } catch (e) { return "sin-firma-" + Date.now(); }
  }

  function setMsg(t, ok) { $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); }

  $("btnGuardar").addEventListener("click", async () => {
    const lista = leerItems();
    const entrega = { nombre: $("entNombre").value.trim(), cargo: $("entCargo").value.trim() };
    const recibe = { nombre: $("recNombre").value.trim(), cargo: $("recCargo").value.trim() };
    if (!lista.length) return setMsg("Escribe al menos un material o herramienta.", false);
    if (lista.some(i => !i.item)) return setMsg("Falta el nombre del material o equipo en alguno de los renglones.", false);
    if (lista.some(i => !(i.cantidad > 0))) return setMsg("Revisa las cantidades: deben ser mayores a cero.", false);
    if (!entrega.nombre || !entrega.cargo || !recibe.nombre || !recibe.cargo) return setMsg("Faltan nombre y cargo de quien entrega y de quien recibe.", false);
    if (!db) return setMsg("Sin conexión a la base de datos. Intenta de nuevo.", false);

    $("btnGuardar").disabled = true;
    const base = { tipo: tipoActual, obra: $("obra").value.trim(), items: lista, entrega, recibe, timestamp: new Date().toISOString() };
    const firma = await generarFirma(base);
    try {
      await db.collection("movimientos").add({ ...base, firma, creado: firebase.firestore.FieldValue.serverTimestamp() });
      setMsg("Movimiento registrado y firmado. Folio: " + firma, true);
      reiniciarItems();
      abrirComprobante({ ...base, firma }, true);
    } catch (e) { setMsg("Error al guardar: " + e.message, false); }
    $("btnGuardar").disabled = false;
  });

  let movs = [];
  function normalizar(d) {
    return {
      tipo: d.tipo, obra: d.obra || "", firma: d.firma || "", timestamp: d.timestamp || "",
      items: d.items || [{ cantidad: d.cantidad, item: d.item, marca: "", observaciones: "" }],
      entrega: d.entrega || { nombre: d.quienEntregaNombre || "", cargo: "" },
      recibe: d.recibe || { nombre: d.quienRecibeNombre || "", cargo: "" }
    };
  }
  const fechaTxt = d => d.timestamp ? new Date(d.timestamp).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }) : "";
  const quien = p => esc(p.nombre) + (p.cargo ? " (" + esc(p.cargo) + ")" : "");
  const listaItems = its => its.map(i => `<li>${esc(i.cantidad)} × ${esc(i.item)}${i.marca ? " - " + esc(i.marca) : ""}${i.observaciones ? `<span class="obs-txt">Obs: ${esc(i.observaciones)}</span>` : ""}</li>`).join("");

  function renderHistorial(docs) {
    movs = docs.map(normalizar);
    const cont = $("historial");
    if (!movs.length) { cont.innerHTML = '<div class="empty">Aún no hay movimientos registrados.</div>'; return; }
    const nombres = new Set(), cargos = new Set();
    cont.innerHTML = movs.map((d, i) => {
      [d.entrega, d.recibe].forEach(p => { if (p.nombre) { nombres.add(p.nombre); if (p.cargo) { cargos.add(p.cargo); personas[p.nombre] = p.cargo; } } });
      return `<div class="mov">
        <div class="mov-top"><span class="tag ${esc(d.tipo)}">${esc(d.tipo)}</span><span>${esc(d.obra || "Sin obra")} · ${esc(fechaTxt(d))}</span></div>
        <ul>${listaItems(d.items)}</ul>
        <div class="mov-who">${quien(d.entrega)} → ${quien(d.recibe)}</div>
        <div class="firma">Folio: ${esc(d.firma)}</div>
        <div class="acciones"><button type="button" class="btn-mini" data-ver="${i}">Ver comprobante</button><button type="button" class="btn-mini" data-pdf="${i}">Descargar PDF</button></div>
      </div>`;
    }).join("");
    $("nombres").innerHTML = [...nombres].map(n => `<option value="${esc(n)}">`).join("");
    $("cargos").innerHTML = [...cargos].map(c => `<option value="${esc(c)}">`).join("");
  }

  function abrirComprobante(raw, nuevo) {
    const d = normalizar(raw);
    $("docBox").innerHTML = `
      ${nuevo ? '<div class="ok-banner">✓ Movimiento registrado y guardado</div>' : ""}
      <h2>Comprobante de movimiento</h2>
      <div class="doc-line"><b>Movimiento:</b> ${esc(d.tipo).toUpperCase()}</div>
      <div class="doc-line"><b>Fecha y hora:</b> ${esc(fechaTxt(d))}</div>
      <div class="doc-line"><b>Obra:</b> ${esc(d.obra || "-")}</div>
      <div class="doc-line"><b>Folio (firma):</b> <span class="firma">${esc(d.firma)}</span></div>
      <ul class="doc-items">${listaItems(d.items)}</ul>
      <div class="doc-line"><b>Entrega:</b> ${quien(d.entrega)}</div>
      <div class="doc-line"><b>Recibe:</b> ${quien(d.recibe)}</div>
      <div class="acciones"><button type="button" class="btn-mini prim" id="docPdf">Descargar PDF</button><button type="button" class="btn-mini" id="docCerrar">Cerrar</button></div>`;
    $("docPdf").onclick = () => generarPDF(d);
    $("docCerrar").onclick = () => $("modal").classList.remove("open");
    $("modal").classList.add("open");
    $("modal").scrollTop = 0;
  }

  function generarPDF(d) {
    if (!window.jspdf) { alert("No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo."); return; }
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const W = 215.9, M = 16;
    let y = 20;
    doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.text("S2S Constructora", M, y);
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text("Comprobante de movimiento de material y herramienta", M, y + 6);
    doc.setDrawColor(166, 87, 46); doc.setLineWidth(0.8); doc.line(M, y + 10, W - M, y + 10);
    y += 20;
    const campo = (k, v) => {
      const ls = doc.splitTextToSize(String(v || "-"), W - 2 * M - 36);
      doc.setFont("helvetica", "bold"); doc.text(k, M, y);
      doc.setFont("helvetica", "normal"); doc.text(ls, M + 36, y);
      y += 6 * ls.length + 1;
    };
    campo("Movimiento:", String(d.tipo).toUpperCase());
    campo("Fecha y hora:", fechaTxt(d));
    campo("Obra:", d.obra);
    campo("Folio (firma):", d.firma);
    y += 4;
    const cx = [M, M + 16, M + 84, M + 118], cw = [12, 64, 30, W - M - (M + 118)];
    const encabezado = () => {
      doc.setFillColor(237, 234, 226); doc.rect(M, y - 5, W - 2 * M, 8, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(10);
      ["Cant.", "Material o equipo", "Marca", "Observaciones"].forEach((t, i) => doc.text(t, cx[i], y));
      y += 8; doc.setFont("helvetica", "normal");
    };
    encabezado();
    d.items.forEach(it => {
      const cols = [String(it.cantidad), it.item, it.marca || "-", it.observaciones || "-"].map((t, i) => doc.splitTextToSize(String(t), cw[i]));
      const h = Math.max(...cols.map(c => c.length)) * 5 + 2;
      if (y + h > 250) { doc.addPage(); y = 20; encabezado(); }
      cols.forEach((c, i) => doc.text(c, cx[i], y));
      y += h;
      doc.setDrawColor(217, 211, 196); doc.setLineWidth(0.2); doc.line(M, y - 3, W - M, y - 3);
    });
    y += 8;
    if (y > 225) { doc.addPage(); y = 20; }
    doc.setFontSize(11);
    campo("Entrega:", d.entrega.nombre + (d.entrega.cargo ? " (" + d.entrega.cargo + ")" : ""));
    campo("Recibe:", d.recibe.nombre + (d.recibe.cargo ? " (" + d.recibe.cargo + ")" : ""));
    y += 16;
    doc.setDrawColor(34, 38, 43); doc.setLineWidth(0.3);
    doc.line(M, y, M + 70, y); doc.line(W - M - 70, y, W - M, y);
    doc.setFontSize(9); doc.text("Firma de quien entrega", M, y + 5); doc.text("Firma de quien recibe", W - M - 70, y + 5);
    doc.setFontSize(8); doc.setTextColor(120);
    doc.text("Firma electrónica de control: " + d.firma + " - Documento generado a partir del registro guardado.", M, 268);
    doc.save("comprobante-" + (d.firma || "s2s") + ".pdf");
  }

  $("historial").addEventListener("click", e => {
    const v = e.target.dataset.ver, p = e.target.dataset.pdf;
    if (v !== undefined) abrirComprobante(movs[+v], false);
    if (p !== undefined) generarPDF(movs[+p]);
  });
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").classList.remove("open"); });

  function initFirebase() {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.collection("movimientos").orderBy("creado", "desc").limit(30).onSnapshot(
      snap => renderHistorial(snap.docs.map(d => d.data())),
      () => { $("historial").innerHTML = '<div class="empty">No se pudo leer el historial (revisa la conexión o las reglas de Firestore).</div>'; }
    );
  }

  reiniciarItems();
  initFirebase();
</script>
</body>
</html>
